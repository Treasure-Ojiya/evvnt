<section class="section-container my-24">
  <!-- Header + Cart -->
  <div
    class="flex flex-col md:flex-row justify-between md:items-center mb-5 gap-4"
  >
    <div>
      <h1 class="text-3xl font-bold text-[#1F3B6C] mb-2">Upcoming Events</h1>
      <p class="text-gray-600 text-base">
        Discover exciting events near you — concerts, workshops, conferences,
        and more.
      </p>
    </div>

    <button
      class="relative group bg-[#6B63FF] hover:bg-[#00BFA6] text-white px-6 py-3 rounded-lg font-semibold transition-colors duration-300 self-start md:self-auto"
      (click)="goToBooking()"
    >
      View Bookings
      <span
        class="absolute -top-2 -right-2 bg-[#00BFA6] text-white text-xs rounded-full px-2 py-1 transition-colors duration-300 group-hover:bg-[#FF6B35]"
      >
        {{ cart().length }}
      </span>
    </button>
  </div>

  <div class="flex flex-wrap gap-3 mb-8">
    @for (cat of categories; track cat) {
    <button
      (click)="filterByCategory(cat)"
      class="px-4 py-2 rounded-full font-medium border transition"
      [class.bg-[#00BFA6]]="selectedCategory() === cat"
      [class.text-white]="selectedCategory() === cat"
      [class.border-[#00BFA6]]="selectedCategory() === cat"
      [class.text-[#1F3B6C]]="selectedCategory() !== cat"
      [class.border-gray-300]="selectedCategory() !== cat"
      [class.hover:bg-[#00BFA6]]="selectedCategory() !== cat"
      [class.hover:text-white]="selectedCategory() !== cat"
    >
      {{ cat }}
    </button>
    }
  </div>

  <!-- Events Grid -->
  <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-8">
    @for (event of filteredEvents; track event.id) {
    <div
      class="bg-white rounded-2xl shadow-sm hover:shadow-lg transition duration-300 border border-[#E0E0E0] flex flex-col overflow-hidden"
    >
      <div class="relative">
        <img
          [src]="event.image"
          alt="Event Image"
          class="h-48 w-full object-cover"
        />
      </div>

      <div class="py-5 px-2 flex flex-col flex-1">
        <h2 class="text-xl font-semibold text-[#1F3B6C] mb-1">
          {{ event.title }}
        </h2>
        <p class="text-gray-600 text-sm mb-1">
          {{ event.date | date : "fullDate" }}
        </p>
        <p class="font-semibold text-[#FF6B35] mb-4">
          {{ event.price > 0 ? "₦" + event.price : "Free" }}
        </p>

        <div class="flex justify-between mt-auto pt-2 border-t border-gray-100">
          <button
            class="bg-[#1F3B6C] hover:bg-[#163060] cursor-pointer text-white py-2 px-4 rounded-lg font-semibold transition"
          >
            View Details
          </button>
          <button
            (click)="bookEvent(event)"
            class="bg-[#00BFA6] hover:bg-[#00a68b] cursor-pointer text-white py-2 px-4 rounded-lg font-semibold transition"
          >
            Book Ticket
          </button>
        </div>
      </div>
    </div>
    }
  </div>
</section>
