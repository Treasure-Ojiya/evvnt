<!-- DASHBOARD LAYOUT -->
<div class="fixed inset-0 flex flex-col overflow-hidden bg-surface">
  <!-- HEADER -->
  <header
    class="shrink-0 flex items-center justify-between bg-nav text-ink px-6 py-2 shadow-md z-40"
  >
    <div class="flex items-center space-x-4">
      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="md:hidden p-2 rounded-md transition"
      >
        <i class="fas fa-bars text-lg"></i>
      </button>

      <img
        src="assets/logo/evvnt-logo-white-1.png"
        alt="Evvnt Logo"
        routerLink="/home"
        class="block w-20 h-auto cursor-pointer brightness-0"
      />
    </div>

    <div class="flex items-center space-x-1">
      <img
        src="assets/icons/profile.svg"
        alt=""
        width="20"
        height="20"
        class="brightness-0"
      />
      <span class="text-md font-medium"> Welcome, {{ user }} </span>
    </div>
  </header>

  <!-- BODY -->
  <div class="flex flex-1 min-h-0 overflow-hidden">
    <!-- MOBILE BACKDROP -->
    @if (mobileMenuOpen) {
      <div
        class="fixed inset-0 bg-black/40 z-40 md:hidden"
        (click)="closeMobileMenu()"
      ></div>
    }

    <!-- SIDEBAR -->
    <aside
      class="shrink-0 bg-linear-to-br from-surface to-brand-soft border-r border-gray-200 shadow-lg flex flex-col gap-6 py-6 px-3 overflow-y-auto fixed md:static inset-y-0 left-0 z-50 md:z-auto w-64 transform transition-all duration-500 md:translate-x-0"
      [ngClass]="{
        'translate-x-0': mobileMenuOpen,
        '-translate-x-full': !mobileMenuOpen,
        'md:w-64 md:px-4': !isCollapsed,
        'md:w-20': isCollapsed,
      }"
    >
      <!-- NAVIGATION (Home is just another item now) -->
      <nav class="flex flex-col space-y-2 w-full text-ink">
        @for (item of navItems; track item.link) {
          <a
            [routerLink]="item.link"
            routerLinkActive="bg-brand/10"
            class="flex items-center space-x-3 p-3 rounded-xl hover:bg-ink/5 transition w-full"
            [ngClass]="{ 'md:justify-center md:space-x-0': isCollapsed }"
            (click)="closeMobileMenu()"
          >
            <img [src]="item.icon" [alt]="item.label" width="20" height="20" />

            @if (!isCollapsed) {
              <span class="font-medium">{{ item.label }}</span>
            }
          </a>
        }
      </nav>

      <!-- LOGOUT -->
      <button
        type="button"
        (click)="logout()"
        class="mt-auto flex items-center space-x-3 p-3 rounded-xl w-full text-ink/70 hover:bg-ink/5 hover:text-ink transition"
        [ngClass]="{ 'md:justify-center md:space-x-0': isCollapsed }"
      >
        <img
          src="assets/icons/logout.svg"
          alt="Logout"
          width="20"
          height="20"
        />

        @if (!isCollapsed) {
          <span class="font-medium">Logout</span>
        }
      </button>
    </aside>

    <!-- MAIN CONTENT: the only scroll container on the page -->
    <main
      class="flex-1 min-w-0 min-h-0 overflow-y-auto overflow-x-hidden bg-surface"
    >
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
