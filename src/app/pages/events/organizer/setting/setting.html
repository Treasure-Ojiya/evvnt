<section class="px-4 sm:px-6 lg:px-8 py-8">
  <div class="mb-10 border-b border-gray-200 pb-2">
    <h1 class="text-3xl md:text-4xl font-bold text-ink">Settings</h1>
  </div>

  <div class="space-y-8">
    <!-- Profile Section -->
    <div class="bg-white shadow-sm rounded-xl p-6">
      <h3 class="text-lg font-semibold text-ink mb-4">Organizer Profile</h3>
      <form class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-gray-600 text-sm mb-1">Full Name</label>
          <input
            type="text"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand/30 focus:border-brand focus:outline-none"
            placeholder="John Doe"
          />
        </div>
        <div>
          <label class="block text-gray-600 text-sm mb-1">Email</label>
          <input
            type="email"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand/30 focus:border-brand focus:outline-none"
            placeholder="john@example.com"
          />
        </div>
        <div>
          <label class="block text-gray-600 text-sm mb-1">Phone</label>
          <input
            type="text"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand/30 focus:border-brand focus:outline-none"
            placeholder="+234 800 000 0000"
          />
        </div>
        <div>
          <label class="block text-gray-600 text-sm mb-1">Organization</label>
          <input
            type="text"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand/30 focus:border-brand focus:outline-none"
            placeholder="Evvnt Inc."
          />
        </div>
      </form>

      <div class="text-right mt-6">
        <button
          class="bg-brand text-white px-5 py-2 rounded-lg font-medium hover:bg-brand-dark transition"
        >
          Save Changes
        </button>
      </div>
    </div>

    <!-- Security Section -->
    <div class="bg-white shadow-sm rounded-xl p-6">
      <h3 class="text-lg font-semibold text-ink mb-4">Security</h3>
      <form class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-gray-600 text-sm mb-1"
            >Current Password</label
          >
          <input
            type="password"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand/30 focus:border-brand focus:outline-none"
          />
        </div>
        <div>
          <label class="block text-gray-600 text-sm mb-1">New Password</label>
          <input
            type="password"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand/30 focus:border-brand focus:outline-none"
          />
        </div>
      </form>

      <div class="text-right mt-6">
        <button
          class="bg-brand text-white px-5 py-2 rounded-lg font-medium hover:bg-brand-dark transition"
        >
          Update Password
        </button>
      </div>
    </div>

    <!-- Payout Details -->
    <div class="bg-white shadow-sm rounded-xl p-6">
      <h3 class="text-lg font-semibold text-ink mb-4">Payout Information</h3>
      <form class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-gray-600 text-sm mb-1">Bank Name</label>
          <input
            type="text"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand/30 focus:border-brand focus:outline-none"
            placeholder="GTBank"
          />
        </div>
        <div>
          <label class="block text-gray-600 text-sm mb-1">Account Number</label>
          <input
            type="text"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-brand/30 focus:border-brand focus:outline-none"
            placeholder="0123456789"
          />
        </div>
      </form>

      <div class="text-right mt-6">
        <button
          class="bg-brand text-white px-5 py-2 rounded-lg font-medium hover:bg-brand-dark transition"
        >
          Save Payout Info
        </button>
      </div>
    </div>
  </div>
</section>
