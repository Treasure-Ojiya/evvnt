<section
  class="w-full bg-[#F5F5F5] min-h-screen mx-auto px-8 sm:px-12 md:px-5 py-2"
>
  <div class="mb-10 border-b border-[#00BFA6] pb-2">
    <h1 class="text-3xl md:text-4xl font-bold text-[#1F3B6C]">Finance</h1>
  </div>

  <div>
    <!-- Finance Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-3">
      <div
        class="bg-[#EAF2FF] p-5 rounded-xl text-center hover:shadow-md hover:-translate-y-1 transition"
      >
        <p class="text-[#1F3B6C]/80 text-sm">Total Revenue</p>
        <h3 class="text-2xl font-bold text-[#1F3B6C] mt-1">₦1,240,000</h3>
      </div>
      <div
        class="bg-[#E6FFF6] p-5 rounded-xl text-center hover:shadow-md hover:-translate-y-1 transition"
      >
        <p class="text-[#00BFA6]/80 text-sm">Available Balance</p>
        <h3 class="text-2xl font-bold text-[#00BFA6] mt-1">₦250,000</h3>
      </div>
      <div
        class="bg-[#FFF4E6] p-5 rounded-xl text-center hover:shadow-md hover:-translate-y-1 transition"
      >
        <p class="text-[#FF6B35]/80 text-sm">Pending Payouts</p>
        <h3 class="text-2xl font-bold text-[#FF6B35] mt-1">₦80,000</h3>
      </div>
      <div
        class="bg-[#F0EDFF] p-5 rounded-xl text-center hover:shadow-md hover:-translate-y-1 transition"
      >
        <p class="text-[#6C63FF]/80 text-sm">Total Events Tracked</p>
        <h3 class="text-2xl font-bold text-[#6C63FF] mt-1">12</h3>
      </div>
    </div>

    <!-- Transaction History -->
    <div class="bg-white shadow-sm rounded-xl overflow-x-auto">
      <table class="min-w-full text-sm text-gray-700">
        <thead>
          <tr class="bg-[#EAF2FF] text-[#1F3B6C]">
            <th class="px-6 py-3 text-left font-semibold">Date</th>
            <th class="px-6 py-3 text-left font-semibold">Event</th>
            <th class="px-6 py-3 text-left font-semibold">Amount</th>
            <th class="px-6 py-3 text-left font-semibold">Status</th>
            <th class="px-6 py-3 text-left font-semibold">Type</th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-b hover:bg-[#F9FAFF] transition">
            <td class="px-6 py-3">Oct 20, 2025</td>
            <td class="px-6 py-3">Music Fiesta 2025</td>
            <td class="px-6 py-3 font-semibold">₦25,000</td>
            <td class="px-6 py-3">
              <span
                class="bg-[#E6FFF6] text-[#00BFA6] px-3 py-1 rounded-full text-xs font-medium"
                >Paid</span
              >
            </td>
            <td class="px-6 py-3 text-gray-500">Ticket Sale</td>
          </tr>

          <tr class="border-b hover:bg-[#F9FAFF] transition">
            <td class="px-6 py-3">Oct 18, 2025</td>
            <td class="px-6 py-3">Tech Expo</td>
            <td class="px-6 py-3 font-semibold">₦10,000</td>
            <td class="px-6 py-3">
              <span
                class="bg-[#FFF4E6] text-[#FF6B35] px-3 py-1 rounded-full text-xs font-medium"
                >Pending</span
              >
            </td>
            <td class="px-6 py-3 text-gray-500">Payout</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
