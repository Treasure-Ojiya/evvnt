<section class="px-4 sm:px-6 lg:px-8 py-8">
  <div class="mb-10 border-b border-gray-200 pb-2">
    <h1 class="text-3xl md:text-4xl font-bold text-ink">Finance</h1>
  </div>

  <div>
    <!-- Finance Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-3">
      <!-- Total Revenue is the one highlighted metric -->
      <div
        class="bg-brand-soft border border-brand/20 p-5 rounded-xl text-center hover:shadow-md hover:-translate-y-1 transition"
      >
        <p class="text-gray-500 text-sm">Total Revenue</p>
        <h3 class="text-2xl font-bold text-brand mt-1">₦1,240,000</h3>
      </div>
      <div
        class="bg-white border border-gray-200 p-5 rounded-xl text-center hover:shadow-md hover:-translate-y-1 transition"
      >
        <p class="text-gray-500 text-sm">Available Balance</p>
        <h3 class="text-2xl font-bold text-ink mt-1">₦250,000</h3>
      </div>
      <div
        class="bg-white border border-gray-200 p-5 rounded-xl text-center hover:shadow-md hover:-translate-y-1 transition"
      >
        <p class="text-gray-500 text-sm">Pending Payouts</p>
        <h3 class="text-2xl font-bold text-ink mt-1">₦80,000</h3>
      </div>
      <div
        class="bg-white border border-gray-200 p-5 rounded-xl text-center hover:shadow-md hover:-translate-y-1 transition"
      >
        <p class="text-gray-500 text-sm">Total Events Tracked</p>
        <h3 class="text-2xl font-bold text-ink mt-1">12</h3>
      </div>
    </div>

    <!-- Transaction History -->
    <div class="bg-white shadow-sm rounded-xl overflow-x-auto">
      <table class="min-w-full text-sm text-gray-700">
        <thead>
          <tr class="bg-gray-50 text-ink">
            <th class="px-6 py-3 text-left font-semibold">Date</th>
            <th class="px-6 py-3 text-left font-semibold">Event</th>
            <th class="px-6 py-3 text-left font-semibold">Amount</th>
            <th class="px-6 py-3 text-left font-semibold">Status</th>
            <th class="px-6 py-3 text-left font-semibold">Type</th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
            <td class="px-6 py-3">Oct 20, 2025</td>
            <td class="px-6 py-3">Music Fiesta 2025</td>
            <td class="px-6 py-3 font-semibold">₦25,000</td>
            <td class="px-6 py-3">
              <span
                class="bg-success/10 text-success-dark px-3 py-1 rounded-full text-xs font-medium"
                >Paid</span
              >
            </td>
            <td class="px-6 py-3 text-gray-500">Ticket Sale</td>
          </tr>

          <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
            <td class="px-6 py-3">Oct 18, 2025</td>
            <td class="px-6 py-3">Tech Expo</td>
            <td class="px-6 py-3 font-semibold">₦10,000</td>
            <td class="px-6 py-3">
              <span
                class="bg-accent/10 text-accent-dark px-3 py-1 rounded-full text-xs font-medium"
                >Pending</span
              >
            </td>
            <td class="px-6 py-3 text-gray-500">Payout</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
