  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-24">
    <div class="grid md:grid-cols-2 gap-12 items-center">
      <!-- Text -->
      <div>
        <h1 class="text-3xl md:text-5xl font-bold mb-3 text-ink">Discover.</h1>

        <h1 class="text-brand text-3xl md:text-5xl font-bold mb-3">
