<main
  class="min-h-screen flex items-center justify-center bg-linear-to-br from-[#F5F5F5] via-[#EAEAFD] to-[#DDEBFF] p-6"
>
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <!-- Header -->
    <div class="text-center flex flex-col items-center mb-3">
      <img
        src="assets/logo/evvnt-logo.png"
        alt="Evvnt Logo"
        width="120"
        height="120"
        class="mb-3"
      />
      <h2 class="text-2xl font-bold text-[#1F3B6C]">Reset Password</h2>
      <p class="text-gray-500 mt-1.5">
        Enter your new password below to reset your account access.
      </p>
    </div>

    <!-- Form -->
    <form>
      <div class="mb-6">
        <label class="block text-sm font-medium text-[#1F3B6C] mb-2"
          >New Password</label
        >
        <input
          type="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 rounded-lg border border-[#1F3B6C] focus:outline-none focus:ring-2 focus:ring-[#6b63ff]"
        />
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-[#1F3B6C] mb-2"
          >Confirm Password</label
        >
        <input
          type="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 rounded-lg border border-[#1F3B6C] focus:outline-none focus:ring-2 focus:ring-[#6b63ff]"
        />
      </div>

      <button
        type="submit"
        class="block w-full bg-[#6b63ff] text-white py-3 rounded-md font-semibold hover:bg-[#00BFA6] shadow-lg transition-all duration-300"
      >
        Reset Password
      </button>

      <p class="mt-4 text-center text-sm text-gray-600">
        Back to
        <a
          routerLink="/auth/authentication"
          class="text-[#6b63ff] font-semibold hover:text-[#00BFA6] hover:scale-[1.05] cursor-pointer"
          >Sign in</a
        >
      </p>
    </form>
  </div>
</main>
