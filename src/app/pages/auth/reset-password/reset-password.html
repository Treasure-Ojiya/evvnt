<main
  class="min-h-screen flex items-center justify-center bg-linear-to-br from-surface to-brand-soft p-6"
>
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <!-- Header -->
    <div class="text-center flex flex-col items-center mb-3">
      <img
        src="assets/logo/evvnt-logo.png"
        alt="Evvnt Logo"
        width="120"
        height="120"
        class="mb-3"
      />
      <h2 class="text-lg font-bold text-ink">Reset Password</h2>
      <p class="text-sm text-gray-500 mt-1.5">
        Enter your new password below to reset your account access.
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="resetPasswordForm" (ngSubmit)="onResetPassword()">
      <div class="mb-6">
        <label class="block text-sm font-base text-ink mb-2"
          >New Password</label
        >
        <input
          type="password"
          placeholder="••••••••"
          class="w-full px-4 py-1.5 rounded-lg border border-ink/60 placeholder:text-ink/50 focus:outline-none focus:ring-1 focus:ring-brand/30 focus:border-brand"
          formControlName="password"
        />
      </div>

      <button
        type="submit"
        class="block w-full bg-brand text-white py-1.5 rounded-md font-semibold hover:bg-brand-dark shadow-lg transition-all duration-300"
      >
        Reset Password
      </button>

      <p class="mt-4 text-center text-sm text-gray-600">
        Back to
        <a
          routerLink="/auth/authentication"
          class="text-brand font-semibold hover:text-brand-dark hover:underline cursor-pointer"
          >Sign in</a
        >
      </p>
    </form>
  </div>
</main>
