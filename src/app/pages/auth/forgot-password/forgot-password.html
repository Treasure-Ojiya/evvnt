<main
  class="min-h-screen flex items-center justify-center bg-linear-to-br from-surface to-brand-soft p-6"
>
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <!-- Header -->
    <div class="text-center flex flex-col items-center mb-3">
      <img
        src="assets/logo/evvnt-logo.png"
        alt="Evvnt Logo"
        width="120"
        height="120"
        class="mb-3"
      />
      <h2 class="text-lg font-bold text-ink">Forgot Password</h2>
      <p class="text-sm text-gray-500 mt-1.5">
        Enter your registered email and we’ll send you a reset token.
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onForgotPassword()">
      <div class="mb-6">
        <label class="block text-sm font-base text-ink mb-2">Email</label>
        <input
          type="email"
          placeholder="@email"
          formControlName="email"
          class="w-full px-4 py-1.5 rounded-lg border border-ink/60 placeholder:text-ink/50 focus:outline-none focus:ring-1 focus:ring-brand/30 focus:border-brand"
        />
        @if (
          forgotPasswordForm.controls.email.touched &&
          forgotPasswordForm.controls.email.invalid
        ) {
          <p class="mt-1 text-xs text-danger-dark">
            Enter a valid email address.
          </p>
        }
      </div>

      <button
        type="submit"
        [disabled]="forgotPasswordForm.invalid || isSubmitting"
        class="flex w-full items-center justify-center gap-2 bg-brand text-white py-2 rounded-md font-semibold hover:bg-brand-dark shadow-lg transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (isSubmitting) {
          <span
            class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
          ></span>
          <span>Sending...</span>
        } @else {
          <span>Send Reset Link</span>
        }
      </button>

      <p class="mt-4 text-center text-sm text-gray-600">
        Remember your password?
        <a
          routerLink="/auth/authentication"
          class="text-brand font-semibold hover:text-brand-dark hover:underline"
          >Sign in</a
        >
      </p>
    </form>
  </div>
</main>
