<main
  class="min-h-screen flex items-center justify-center bg-linear-to-br from-[#F5F5F5] via-[#EAEAFD] to-[#DDEBFF] p-6"
>
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <!-- Header -->
    <div class="text-center flex flex-col items-center mb-3">
      <img
        src="assets/logo/evvnt-logo.png"
        alt="Evvnt Logo"
        width="120"
        height="120"
        class="mb-3"
      />
      <h2 class="text-lg font-bold text-[#1F3B6C]">Forgot Password</h2>
      <p class="text-sm text-gray-500 mt-1.5">
        Enter your registered email and we’ll send you a reset token.
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onForgotPassword()">
      <div class="mb-6">
        <label class="block text-sm font-base text-[#1F3B6C] mb-2">Email</label>
        <input
          type="email"
          placeholder="@email"
          formControlName="email"
          class="w-full px-4 py-1.5 rounded-lg border border-[#1F3B6C]/60 placeholder:text-[#1F3B6C]/50 focus:outline-none focus:ring-1 focus:ring-[#1F3B6C]/20 focus:border-[#1F3B6C]/70"
        />
      </div>

      <button
        type="submit"
        class="block w-full bg-[#6b63ff] text-white py-1.5 rounded-md font-semibold hover:bg-[#00BFA6] shadow-lg transition-all duration-300"
      >
        Send Reset Link
      </button>

      <p class="mt-4 text-center text-sm text-gray-600">
        Remember your password?
        <a
          routerLink="/auth/authentication"
          class="text-[#6b63ff] font-semibold hover:text-[#00BFA6] hover:scale-[1.05]"
          >Sign in</a
        >
      </p>
    </form>
  </div>
</main>
