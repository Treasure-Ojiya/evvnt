<section class="section-container my-24">
  <h1 class="text-3xl font-bold text-[#1F3B6C] mb-10">My Bookings</h1>

  @if (bookedEvents().length === 0) {
  <p class="text-gray-500 text-lg">No events booked yet.</p>
  } @else {
  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
    @for (event of bookedEvents(); track event.id) {
    <div
      class="bg-white rounded-xl shadow p-5 border border-[#E0E0E0] hover:shadow-lg transition"
    >
      <img
        [src]="event.image"
        alt="Event Image"
        class="h-40 w-full object-cover rounded-lg mb-4"
      />
      <h2 class="text-xl font-semibold text-[#1F3B6C] mb-1">
        {{ event.title }}
      </h2>
      <p class="text-gray-600 mb-1">{{ event.date | date : "mediumDate" }}</p>
      <p class="font-semibold text-[#FF6B35]">
        {{ event.price > 0 ? "₦" + event.price : "Free" }}
      </p>

      <div class="flex justify-between mt-4">
        <button
          (click)="openDetails(event)"
          class="px-4 py-2 bg-[#1F3B6C] text-white rounded-lg hover:bg-[#163060]"
        >
          View Details
        </button>
        <button
          (click)="proceedToPayment(event)"
          class="px-4 py-2 bg-[#00BFA6] text-white rounded-lg hover:bg-[#00a68b]"
        >
          Pay
        </button>
      </div>
    </div>
    }
  </div>
  }
</section>
