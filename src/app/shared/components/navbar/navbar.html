@if (showNavbar) {
<div
  class="navbar-container fixed top-0 left-0 w-full z-50 backdrop-blur-md transition-all duration-500 ease-in-out"
  [ngClass]="{
    'bg-white shadow-md': scrolled || !isHomePage,
    'bg-gray-50': isHomePage && !scrolled
  }"
>
  <div class="section-container flex justify-between items-center py-2">
    <!-- Logo -->
    <div>
      <a routerLink="/home">
        <img
          src="assets/logo/evvnt-logo.png"
          alt="Logo"
          width="150"
          height="150"
          class="block"
      /></a>
    </div>

    <!-- Hamburger for small screens -->
    <button
      class="text-black md:hidden text-3xl focus:outline-none transition-all duration-300"
      (click)="toggleMenu()"
    >
      <i
        class="fas"
        [ngClass]="{ 'fa-bars': !menuOpen, 'fa-times': menuOpen }"
      ></i>
    </button>

    <!-- Nav Links -->
    <nav
      class="navbar md:flex md:items-center md:space-x-6 md:static absolute top-full left-0 w-full md:w-auto bg-white/95 md:bg-transparent flex flex-col md:flex-row overflow-hidden transition-all duration-500 ease-in-out transform"
      [ngClass]="{
        'opacity-0 max-h-0 pointer-events-none md:opacity-100 md:max-h-full md:pointer-events-auto':
          !menuOpen,
        'opacity-100 max-h-[500px] pointer-events-auto': menuOpen
      }"
    >
      <a
        routerLink="/home"
        class="block md:inline-block p-4 font-semibold text-black hover:text-[#FF6B35] hover:underline hover:underline-offset-8 hover:decoration-2 transition-all duration-300"
        (click)="closeMenu()"
        >Home</a
      >

      <a
        routerLink="/my-booking"
        class="block md:inline-block p-4 font-semibold text-black hover:text-[#FF6B35] hover:underline hover:underline-offset-8 hover:decoration-2 transition-all duration-300"
        (click)="closeMenu()"
        >Bookings</a
      >

      <a
        routerLink="/events/event-list"
        class="block md:inline-block p-4 font-semibold text-black hover:text-[#FF6B35] hover:underline hover:underline-offset-8 hover:decoration-2 transition-all duration-300"
        (click)="closeMenu()"
        >Events</a
      >

      <a
        routerLink="/events/organizer"
        class="block md:inline-block p-4 font-semibold text-black hover:text-[#FF6B35] hover:underline hover:underline-offset-8 hover:decoration-2 transition-all duration-300"
        (click)="closeMenu()"
        >Host Event</a
      >

      <a
        routerLink="/listings/provider"
        class="block md:inline-block p-4 font-semibold text-black hover:text-[#FF6B35] hover:underline hover:underline-offset-8 hover:decoration-2 transition-all duration-300"
        (click)="closeMenu()"
        >List Space</a
      >

      <!-- Login inside menu (mobile only) -->
      @if( !isLoggedIn ){
      <a
        (click)="goToAuth(); closeMenu()"
        class="block md:hidden p-4 font-semibold text-black hover:text-[#FF6B35] transition-all duration-300 cursor-pointer"
      >
        Login / Register </a
      >} @if( isLoggedIn ){
      <button
        (click)="logout(); closeMenu()"
        class="block md:hidden p-4 font-semibold text-black hover:text-[#FF6B35] transition-all duration-300 text-left"
      >
        Logout</button
      >}
    </nav>

    <!-- Right side (desktop only) -->
    <div class="hidden md:flex items-center space-x-4">
      <!-- <app-search-bar></app-search-bar> -->
      <div class="relative" (click)="toggleDropdown($event)">
        <img
          src="assets/icons/profile.svg"
          alt="Profile"
          width="50"
          height="50"
          class="cursor-pointer"
        />
        @if (showDropdown) {
        <div
          class="absolute right-0 mt-2 w-40 bg-white rounded-lg shadow-lg py-2 z-50 text-[#1f3b6cff] origin-top-right transition-all duration-200"
        >
          @if (!isLoggedIn) {
          <a
            (click)="goToAuth(); closeDropdown()"
            class="block px-4 py-2 hover:bg-[#f3f4f6] cursor-pointer"
          >
            Login / Register
          </a>
          } @else {
          <button
            (click)="logout(); closeDropdown()"
            class="block w-full text-left px-4 py-2 hover:bg-[#f3f4f6]"
          >
            Logout
          </button>
          }
        </div>
        }
      </div>
    </div>
  </div>
</div>
}
