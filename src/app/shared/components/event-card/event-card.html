<div class="bg-white rounded-2xl overflow-hidden shadow-lg">
  <img [src]="event.image" alt="Event Image" class="w-full h-56 object-cover" />
  <div class="p-6 space-y-4">
    <h2 class="text-2xl font-bold text-[#1F3B6C]">{{ event.title }}</h2>
    <p class="text-gray-600">{{ event.date | date : "fullDate" }}</p>
    <p class="text-gray-700 leading-relaxed">{{ event.description }}</p>
    <p class="font-semibold text-[#00BFA6] text-lg">
      {{ event.price > 0 ? "₦" + event.price : "Free" }}
    </p>

    <div class="flex justify-end">
      <button
        mat-raised-button
        color="primary"
        class="!bg-[#00BFA6] hover:!bg-[#00a68b] text-white font-semibold rounded-lg"
        (click)="close()"
      >
        Close
      </button>
    </div>
  </div>
</div>
