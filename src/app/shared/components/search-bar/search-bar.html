<div class="relative w-full p-0.5 bg-white rounded-full shadow-sm z-20">
  <div class="flex items-center gap-2">
    <div class="relative flex-1">
      <input
        #searchInput
        id="search"
        type="search"
        autocomplete="off"
        aria-label="Search events"
        placeholder="Search events"
        class="w-full rounded-full border border-gray-200 py-3 px-4 font-semibold text-sm text-ink placeholder:text-gray-400 focus:outline-2 focus:outline-brand"
        [(ngModel)]="searchText"
        (input)="onInput()"
        (keydown.enter)="submit()"
        (blur)="hideDropdown()"
      />

      @if (showDropdown && eventSuggestions.length > 0) {
        <ul
          class="absolute left-0 right-0 mt-2 bg-white border border-gray-200 rounded-2xl shadow-lg max-h-72 overflow-y-auto z-50 py-1"
        >
          @for (title of eventSuggestions; track title) {
            <li
              class="text-ink font-semibold px-4 py-2 hover:bg-brand-soft cursor-pointer"
              (mousedown)="selectEvent(title)"
            >
              {{ title }}
            </li>
          }
        </ul>
      }
    </div>

    <button
      type="button"
      (click)="submit()"
      class="px-4 py-2 bg-brand text-white font-semibold rounded-full cursor-pointer hover:bg-brand-dark disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200"
      [disabled]="!searchText.trim()"
    >
      Search
    </button>
  </div>
</div>
