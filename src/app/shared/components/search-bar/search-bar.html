<div class="w-full md:w-[80%] px-6">
  <div class="relative">
    <div class="relative w-full">
      <input
        id="location"
        type="text"
        placeholder="Search by location (e.g., Lagos, Ikeja)"
        class="w-full md:w-[800px] rounded-2xl border border-gray-500 bg-[#F5F5F5] px-4 py-4 pr-12 text-black placeholder-gray-500 shadow-sm focus:border-[#1F3B6C] focus:ring-2 focus:ring-[#1F3B6C]/40 transition-all duration-200"
        [(ngModel)]="searchLocation"
        (input)="filterLocations()"
        (blur)="hideDropdown()"
      />
      <div
        class="absolute inset-y-0 -right-44 px-4 bg-[#1F3B6C] rounded-r-2xl flex items-center justify-center cursor-pointer"
      >
        <img src="assets/icons/search.svg" alt="Search" class="w-5 h-5" />
      </div>
    </div>

    @if (filteredLocations.length > 0 && showDropdown) {
    <ul
      class="absolute left-0 right-0 mt-2 bg-white border border-gray-200 rounded-2xl shadow-lg max-h-56 overflow-y-auto z-50"
    >
      @for (loc of filteredLocations; track loc) {
      <li
        class="text-[#1F3B6C] font-semibold px-4 py-2 hover:bg-[#1F3B6C]/10 cursor-pointer"
        (mousedown)="selectLocation(loc)"
      >
        {{ loc.state }}, {{ loc.city }}
      </li>
      }
    </ul>
    }
  </div>
</div>
